title: Laravel Clutch
description: An agent harness for Laravel, built on the official Laravel AI SDK.

# The gem rather than remote_theme: one less network fetch at build time,
# and no OpenSSL or git dependency in the build image.
theme: just-the-docs

url: https://obaid.github.io
baseurl: /laravel-clutch

# Rendered as diagrams rather than code blocks.
mermaid:
  version: "10.9.1"

plugins:
  # Rewrites the .md links the source files use so they resolve on the site
  # as well as on GitHub. The markdown stays plain either way.
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

# The guide's contents list should show sections, not the page title or every
# sub-heading under it.
kramdown:
  toc_levels: 2..2

color_scheme: harness
search_enabled: true

search:
  heading_level: 3
  previews: 2
  rel_url: false

aux_links:
  GitHub: https://github.com/obaid/laravel-clutch

aux_links_new_tab: true

back_to_top: true
back_to_top_text: Back to top

footer_content: >-
  Released under the MIT licence.

# Front matter is prepended into the staged copies by bin/stage rather than
# living in the markdown, so the same sources render cleanly on GitHub.
defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - bin
  # The pristine source. bin/stage produces the copy under pages/ that Jekyll
  # actually renders, so this would otherwise be published twice.
  - RECIPES.md
